name: Generuj grafiki (OpenAI)
# Ręcznie: Actions → „Generuj grafiki (OpenAI)” → Run workflow. Wymaga sekretu repozytorium OPENAI_API_KEY.
# Wyniki: public/art/gen/<kategoria>/<ID>_<nazwa>__<poza>.png + manifest.json. Ponowne uruchomienie pomija gotowe pliki (można wznawiać).
on:
  workflow_dispatch:
    inputs:
      category:
        description: 'Kategorie po przecinku albo "all" (wszystko w kolejności produkcji: postacie, bossowie, wrogowie, przedmioty, przewody, kafelki podłoża, mieszkańcy, rekwizyty, paralaksa, tła poziomów, warianty, menu/interfejs, ilustracje fabularne, efekty)'
        required: true
        default: 'all'
      mode:
        description: 'both = ETAP 1: wszystkie bazy, ETAP 2: wszystkie pozy | base = tylko bazy | poses = tylko pozy (wymaga baz)'
        required: true
        default: 'both'
      states:
        description: 'Opcjonalnie: tylko wybrane pozy po przecinku (np. idle,walk,jump_apex). Puste = wszystkie'
        required: false
        default: ''
      model:
        description: 'Model obrazów (np. gpt-image-2, gpt-image-2.6-sunburst, gpt-image-1.5, gpt-image-1-mini)'
        required: true
        default: 'gpt-image-2'
      quality:
        description: 'Jakość: low | medium | high'
        required: true
        default: 'medium'
      concurrency:
        description: 'Równoległe żądania (4 = bezpiecznie; przy błędach 429 zmniejsz)'
        required: true
        default: '4'
      limit:
        description: 'Maks. liczba assetów na kategorię (0 = wszystkie) — do testów ustaw np. 1'
        required: true
        default: '0'
permissions:
  contents: write
jobs:
  gen:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm ci
      - name: Generuj (etap 1 bazy → etap 2 pozy), zapisując w repo po każdej partii
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CATS: ${{ inputs.category }}
          MODE: ${{ inputs.mode }}
        run: |
          git config user.name "gen-art[bot]"; git config user.email "gen-art@users.noreply.github.com"
          if [ "$CATS" = "all" ]; then CATS=$(node tools/gen-art.mjs --list-categories); fi
          LIM="${{ inputs.limit }}"; FAILED=0
          STAGES="base poses"; [ "$MODE" = "base" ] && STAGES="base"; [ "$MODE" = "poses" ] && STAGES="poses"
          for STAGE in $STAGES; do
            echo "######## ETAP: $STAGE ########"
            BATCH=24; [ "$STAGE" = "poses" ] && BATCH=4
            for C in ${CATS//,/ }; do
              DONE=0
              while [ "$DONE" = "0" ]; do
                node tools/gen-art.mjs --category "$C" --limit $BATCH --mode "$STAGE" --states "${{ inputs.states }}" --quality "${{ inputs.quality }}" --model "${{ inputs.model }}" --concurrency "${{ inputs.concurrency }}" | tee /tmp/out.txt || FAILED=1
                git add public/art/gen
                if ! git diff --cached --quiet; then
                  git commit -q -m "art: $STAGE ($C)"
                  git pull -q --rebase origin main && git push -q origin HEAD:main
                fi
                grep -q "obrazów do wygenerowania: 0 " /tmp/out.txt && DONE=1
                grep -q "Gotowe: 0 ok" /tmp/out.txt && { echo "Brak postępu w $C — przechodzę dalej"; DONE=1; }
                grep -qE "BRAK ŚRODKÓW|HTTP 40[13]" /tmp/out.txt && { echo "Błąd konta/klucza — przerywam całość"; exit 1; }
                [ "$LIM" != "0" ] && DONE=1
              done
            done
          done
          exit $FAILED
      - name: Pełne wersje (bez pomniejszenia) jako artefakt
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: art-originals-${{ github.run_id }}
          path: art-originals
          retention-days: 30
          if-no-files-found: ignore
